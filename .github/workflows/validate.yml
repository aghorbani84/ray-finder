name: Validate profiles

on:
  pull_request:
    branches:
      - iran-v2ray-config-aggregator-a43af
  push:
    branches:
      - iran-v2ray-config-aggregator-a43af
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  profile-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build demo profiles
        run: python scripts/main.py --demo

      - name: Validate generated profiles with Mihomo
        run: bash scripts/validate_mihomo.sh

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.txt
