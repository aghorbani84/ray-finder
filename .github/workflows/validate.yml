name: Validate profiles

on:
  pull_request:
    branches:
      - iran-v2ray-config-aggregator-a43af
  push:
    branches:
      - iran-v2ray-config-aggregator-a43af
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  profile-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build demo profiles
        run: python scripts/main.py --demo

      - name: Validate generated profiles with Mihomo
        run: bash scripts/validate_mihomo.sh

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.txt
