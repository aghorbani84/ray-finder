name: Update configs

on:
  push:
    branches:
      - iran-v2ray-config-aggregator-a43af
    paths:
      - 'scripts/**'
      - 'templates/**'
      - 'sources.json'
      - 'README.md'
      - '.github/workflows/update.yml'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggregator pipeline
        run: python scripts/main.py

      - name: Commit and push generated outputs safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ README.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(auto): refresh regional proxy profiles"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            if git push origin "HEAD:refs/heads/${branch}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after refetch."
            sleep $((attempt * 3))
          done
          echo "Unable to push generated outputs after 5 attempts." >&2
          exit 1
