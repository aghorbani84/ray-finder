name: Update configs

on:
  push:
    branches:
      - iran-v2ray-config-aggregator-a43af
    paths:
      - 'scripts/**'
      - 'templates/**'
      - 'sources.json'
      - 'README.md'
      - '.github/workflows/update.yml'
  schedule:
    # off-the-hour cron (GitHub throttles on-the-hour scheduled runs)
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggregator pipeline
        run: python scripts/main.py

      - name: Commit & push outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(auto): update configs $(date -u +'%Y-%m-%d %H:%M UTC')"
          file_pattern: output/ README.md
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          push_options: ""
